      <section aria-labelledby="h-prix">
        <h2 id="h-prix">Prix d’un traiteur à Bordeaux : nos repères</h2>
        <p>Le prix d’un traiteur dépend d’abord du niveau de service. Chaque événement se décline en trois formules : livrée et dressée, servie avec le chef sur place, ou Signature avec une équipe complète. Pour les entreprises et les réceptions privées, Le Buffet Essentiel, à 35 € par convive, ouvre la gamme. Voici nos prix par convive, boissons non comprises sauf mention.</p>

              <tr><td>Mariage</td><td>—</td><td>49 €<span class="fn">La Table</span></td><td>75 €<span class="fn">Le Repas</span></td><td>110 €<span class="fn">Le Grand Jour</span></td></tr>
              <tr><td>Entreprise et réception privée</td><td>35 €<span class="fn">Le Buffet Essentiel</span></td><td>—</td><td>59 €<span class="fn">Le Déjeuner servi</span></td><td>105 €<span class="fn">La Table du Chef</span></td></tr>
              <tr><td>Brunch du lendemain</td><td>—</td><td>19 €<span class="fn">Le Brunch posé</span></td><td>29 €<span class="fn">Le Brunch dressé</span></td><td>45 €<span class="fn">Le Brunch du Chef</span></td></tr>
            </tbody>
          </table>
        </div>
        <p class="note">Prix par convive. Un nombre minimum de convives s’applique à chaque formule.</p>
      </section>

      <section aria-labelledby="h-mariage">
        <h2 id="h-mariage">Prix d’un mariage avec traiteur</h2>
        <p>À Bordeaux, le repas de mariage chez un traiteur se situe le plus souvent entre 65 et 110 € par invité, et au-delà de 120 € pour une cuisine haut de gamme. Nous proposons trois formules :</p>
        <ul>
          <li><strong>La Table, 49 €</strong> : un buffet généreux, livré et dressé, pour les mariés qui organisent eux-mêmes le service.</li>
          <li><strong>Le Repas, 75 €</strong> : hors-d’œuvre servis debout, puis le plat à table, avec le chef sur place du début à la fin.</li>
          <li><strong>Le Grand Jour, 110 €</strong> : de très beaux produits, une équipe complète, un maître d’hôtel et la coordination avec le lieu.</li>
        </ul>
        <p>S’ajoutent selon la formule la vaisselle, les boissons, les fours mobiles (au moins un, puis un de plus par tranche de 40 convives), le camion frigorifique et le déplacement au-delà de 30 km.</p>
        <div class="example">
          <span>Exemple : mariage de <span id="exInvites">80</span> convives, formule Le Repas, vaisselle et forfait vins compris.</span>
          <span>Total indicatif : <b id="exTotal">7 860 €</b>, soit <b id="exParInvite">98 €</b> par convive.</span>
        </div>
      </section>

      <section aria-labelledby="h-conditions">
        <h2 id="h-conditions">Nos conditions</h2>
        <p>Les mêmes règles pour tous nos devis.</p>
        <dl class="conditions">
          <dt>Acompte</dt><dd>30 % à la signature. La date est réservée à réception.</dd>
          <dt>Solde</dt><dd>Au plus tard 7 jours avant l’événement pour les particuliers, à 30 jours sur facture pour les entreprises.</dd>
          <dt>Nombre de convives</dt><dd>Définitif 7 jours avant. Au-delà, le nombre annoncé est facturé.</dd>
          <dt>Allergies et régimes</dt><dd>À signaler 15 jours avant.</dd>
          <dt>Validité du devis</dt><dd>15 jours.</dd>
          <dt>Annulation</dt><dd>L’acompte est conservé, sauf force majeure.</dd>
          <dt>Matériel prêté</dt><dd>À rendre propre sous 48 h. Il est facturé s’il n’est pas rendu.</dd>
        </dl>
      </section>

      <section aria-labelledby="h-faq">
        <h2 id="h-faq">Questions fréquentes</h2>
        <div class="faq" id="faq">
          <details>
            <summary>Quel est le prix d’un traiteur pour un mariage à Bordeaux ?</summary>
            <p>Nos formules mariage vont de 49 € par convive pour La Table, livrée et dressée, à 110 € pour Le Grand Jour, avec une équipe complète et un maître d’hôtel. Le Repas, servi par le chef et son équipe, est à 75 €. La vaisselle et les boissons s’ajoutent selon la formule.</p>
          </details>
          <details>
            <summary>Le prix affiché par le calculateur est-il définitif ?</summary>
            <p>Non. C’est une estimation indicative. Le devis définitif est établi après un échange avec David Sabatier, le chef, sur votre menu, votre lieu et le déroulé de la journée.</p>
          </details>
          <details>
            <summary>Le service est-il compris dans le prix du traiteur ?</summary>
            <p>Cela dépend de la formule. Les formules livrées sont dressées sans service. Les formules servies comprennent le chef sur place et un serveur pour 20 convives. Les formules Signature comprennent une équipe complète. Vous pouvez ajouter un maître d’hôtel ou des serveurs.</p>
          </details>
          <details>
            <summary>Pourquoi un camion frigorifique est-il inclus ?</summary>
            <p>Il garde les produits à la bonne température jusqu’au moment du service, même dans un lieu sans chambre froide. Nous l’incluons dans chaque prestation pour garantir la sécurité alimentaire, sauf pour les repas à la villa Montgolfière, équipée sur place. Il est en option pour Le Brunch posé et Le Buffet Essentiel.</p>
          </details>
          <details>
            <summary>Proposez-vous un brunch le lendemain du mariage ?</summary>
            <p>Oui, en trois formules : Le Brunch posé à 19 €, livré et dressé ; Le Brunch dressé à 29 €, avec une personne sur place pendant 3 heures ; Le Brunch du Chef à 45 €, avec des plats chauds préparés devant les invités. Les enfants de moins de 12 ans sont à 15 €. La livraison est offerte si le brunch accompagne une formule mariage.</p>
          </details>
          <details>
            <summary>Comment les plats sont-ils servis ?</summary>
            <p>Nous privilégions le service à la française : les plats arrivent sur la table et se partagent entre convives, plutôt que le service à la russe, où chacun reçoit une assiette dressée. C’est plus généreux, plus convivial, et chacun se sert selon son appétit.</p>
          </details>
          <details>
            <summary>Intervenez-vous en dehors de Bordeaux ?</summary>
            <p>Oui, dans toute la Nouvelle-Aquitaine : châteaux, propriétés viticoles, maisons privées et lieux de réception, en Gironde comme dans les départements voisins. Au-delà de 30 km, le déplacement est facturé 0,45 € par kilomètre.</p>
          </details>
        </div>
      </section>

/* ---------- Lecture du formulaire ---------- */
const entier = (v, min, max) => {
  let n = parseInt(v, 10);
  if (!Number.isFinite(n)) n = min;
  return Math.min(max, Math.max(min, n));
};

function readState() {
  const evenement = root.querySelector('input[name="evenement"]:checked').value;
  const invites = entier($("guests").value, C.min, C.max);
  const enfants = TARIFS.evenements[evenement].enfants ? entier($("kids").value, 0, invites) : 0;
  const opt = {};
  for (const o of OPTS) {
    const el = $("o-" + o.id);
    if (o.type === "parConvive" || o.type === "forfait" || o.type === "pourcentage") opt[o.id] = el.checked && !el.dataset.force;
    else if (o.type === "quantite") opt[o.id] = entier(el.value, 0, o.max);
    else if (o.type === "km") opt[o.id] = entier(el.value, 0, 2000);
    else if (o.type === "jours") opt[o.id] = entier(el.value, 1, o.joursMax);
    if (o.choix) opt[o.id + "Choix"] = $("o-" + o.id + "-choix").value;
    if (o.optionnelPour) opt[o.id + "On"] = $("o-" + o.id + "-on").checked;
  }
  // Formule absente pour cet événement (ex. Essentiel hors réception) : on revient à « Servie ».
  let formule = root.querySelector('input[name="formule"]:checked').value;
  if (!TARIFS.evenements[evenement].formules[formule]) {
    formule = "servie";
    $("formule-servie").checked = true;
  }
  return {
    evenement,
    formule,
    invites, enfants, opt,
    nom: $("clientNom").value.trim(),
    date: $("clientDate").value
  };
}

/* ---------- Calcul ---------- */
function calculer(s) {
  const evt = TARIFS.evenements[s.evenement];
  const f = evt.formules[s.formule];
  const niveau = TARIFS.niveaux[s.formule].label.toLowerCase();
  const n = s.invites;
  const enfants = evt.enfants ? s.enfants : 0;
  const adultes = n - enfants;
  const lignes = [];

  lignes.push({ label: `${f.nom} · ${evt.label}`, detail: `Formule ${niveau}, ${plur(adultes, "convive")} × ${eur.format(f.prix)}`, montant: adultes * f.prix });
  if (enfants > 0) {
    lignes.push({ label: `Enfants de moins de ${evt.enfants.age} ans`, detail: `${enfants} × ${eur.format(evt.enfants.prix)}`, montant: enfants * evt.enfants.prix });
  }
  if (n < f.min) {
    lignes.push({ label: `Minimum de ${f.min} convives`, detail: `${plur(f.min - n, "convive")} facturé${f.min - n > 1 ? "s" : ""} en plus × ${eur.format(f.prix)}`, montant: (f.min - n) * f.prix });
  }

  // Une option est-elle réellement choisie et facturable ?
  const estActif = (id) => {
    const o = OPTS.find((x) => x.id === id), v = s.opt[id];
    return !!o && (!o.seulement || o.seulement.includes(s.evenement)) && (!o.maxConvives || n <= o.maxConvives)
      && !f.inclut.includes(id) && (typeof v === "boolean" ? v : v > 0);
  };
  const montants = {};
  for (const o of OPTS) {
    if (o.type === "pourcentage") continue;   // calculé après les autres lignes
    const inclus = f.inclut.includes(o.id);
    const v = s.opt[o.id];
    let montant = 0, detail = "";
    if (o.type === "parConvive") {
      const base = o.id === "boissons" ? adultes : n;
      const c = o.choix ? (o.choix[s.opt[o.id + "Choix"]] || o.choix[o.choixDefaut]) : null;
      const prix = c ? c.prix : o.prix;
      montant = base * prix;
      detail = (c ? c.label + ", " : "") + `${base} × ${eur.format(prix)}`;
    }
    if (o.type === "forfait")    { montant = o.prix; detail = "Forfait"; }
    const oblig = !!((o.obligatoireSur && o.obligatoireSur.includes(s.evenement))
      || (o.obligatoireFormules && o.obligatoireFormules.includes(s.formule)));
    if (oblig) { const q = Math.max(1, Math.ceil(n / o.parConvives)); montant = q * o.prix; detail = `${plur(q, o.unite)} × ${eur.format(o.prix)}`; }
    if (o.type === "quantite")   { montant = v * o.prix; detail = `${v} × ${eur.format(o.prix)}`; }
    if (o.type === "km")         { const km = Math.max(0, v - o.franchise); montant = km * o.prixKm; detail = `${km} km au-delà de ${o.franchise} km × ${eur.format(o.prixKm)}`; }
    if (o.type === "jours")      { montant = v * o.prix; detail = `${plur(v, "jour")} × ${eur.format(o.prix)}`; }
    const facultatif = !!(o.optionnelPour && o.optionnelPour.includes(s.evenement + "." + s.formule));
    const dispo = (!o.seulement || o.seulement.includes(s.evenement)) && (!o.maxConvives || n <= o.maxConvives);
    const dep = o.inutileAvec || o.masquerAvec;
    const remplace = !!(dep && estActif(dep));
    const actif = dispo && !remplace && !inclus && (oblig || (o.type === "jours" && (!facultatif || !!s.opt[o.id + "On"])) || (typeof v === "boolean" ? v : v > 0)) && montant > 0;
    montants[o.id] = { montant, inclus, actif, dispo, remplace, oblig, detail, facultatif };
    if (actif) lignes.push({ label: o.label, detail, montant });
  }

  // Options en pourcentage (wedding planner) : appliquées au total des autres lignes.
  const sousTotal = lignes.reduce((t, l) => t + l.montant, 0);
  for (const o of OPTS) {
    if (o.type !== "pourcentage") continue;
    const dispo = !o.seulement || o.seulement.includes(s.evenement);
    const montant = round2(sousTotal * o.taux);
    const actif = dispo && !!s.opt[o.id];
    montants[o.id] = { montant, inclus: false, actif, dispo, remplace: false, oblig: false, detail: "" };
    if (actif) lignes.push({ label: o.label, detail: `${pct(o.taux)} du devis (${eur.format(sousTotal)})`, montant });
  }
  const total = round2(lignes.reduce((t, l) => t + l.montant, 0));
  return { lignes, montants, total, parInvite: total / n, acompte: round2(total * TARIFS.acompte) };
}

/* ---------- Affichage ---------- */
function dateFr(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

let dernier = null;

function render() {
  const s = readState();
  const c = calculer(s);
  dernier = { s, c };
  const evt = TARIFS.evenements[s.evenement];
  const f = evt.formules[s.formule];

  // Cartes de formule
  for (const k of Object.keys(TARIFS.niveaux)) {
    const fk = evt.formules[k];
    root.querySelector(`[data-name="${k}"]`).closest(".choice").hidden = !fk;
    if (!fk) continue;
    root.querySelector(`[data-name="${k}"]`).textContent = fk.nom;
    root.querySelector(`[data-price="${k}"]`).innerHTML = `${eur.format(fk.prix)} <small>/ convive</small>`;
    root.querySelector(`[data-sur="${k}"]`).textContent = fk.surPlace;
    root.querySelector(`[data-min="${k}"]`).textContent = `À partir de ${fk.min} convives`;
  }

  // Menu de la formule choisie
  $("menuNom").textContent = `${f.nom} · ${eur.format(f.prix)} par convive`;
  $("menuIntro").textContent = f.intro;
  const dl = $("menuListe");
  dl.textContent = "";
  for (const [titre, contenu] of f.menu) {
    const dt = document.createElement("dt"); dt.textContent = titre;
    const dd = document.createElement("dd"); dd.textContent = contenu;
    const wrap = document.createElement("div"); wrap.append(dt, dd);
    dl.appendChild(wrap);
  }
  $("menuInclus").textContent = f.inclus + ".";
  $("menuNonInclus").textContent = f.nonInclus + ".";
  $("menuNonInclusWrap").hidden = !f.nonInclus;
  $("evtNote").textContent = evt.note || "";
  $("evtNote").hidden = !evt.note;

  // Convives
  $("kidsRow").hidden = !evt.enfants;
  if (evt.enfants) {
    $("kidsLabel").textContent = `dont enfants de moins de ${evt.enfants.age} ans (${eur.format(evt.enfants.prix)} par enfant)`;
    $("kids").max = s.invites;
  }
  $("guestsHint").innerHTML = s.invites < f.min
    ? `<strong>Minimum ${f.min} convives</strong> pour ${f.nom} : ${f.min} convives sont facturés.`
    : `Minimum ${f.min} convives pour ${f.nom}.`;

  // Options
  for (const o of OPTS) {
    const m = c.montants[o.id];
    const row = $("opt-" + o.id);
    const el = $("o-" + o.id);
    row.classList.toggle("included", m.inclus);
    row.classList.toggle("on", m.actif);
    row.hidden = (!!o.seulement && !o.seulement.includes(s.evenement)) || (!!o.masquerAvec && m.remplace);
    if (o.type === "parConvive" || o.type === "forfait" || o.type === "pourcentage") el.disabled = m.inclus || !m.dispo || m.oblig;
    if (o.obligatoireSur) {
      if (m.oblig) { el.checked = true; el.dataset.force = "1"; }
      else if (el.dataset.force) { el.checked = false; delete el.dataset.force; }
      row.querySelector(".desc").textContent = m.oblig
        ? `Obligatoire pour cette formule : 1 ${o.unite} minimum, puis 1 de plus par tranche de ${o.parConvives} convives, soit ici ${m.detail.split(" ×")[0]}.`
        : o.detail;
    }
    $("a-" + o.id).textContent = m.inclus ? "Inclus" : (m.actif ? "" : "+ ") + eur0.format(m.montant);
    if (!m.inclus && !m.actif && (o.type === "quantite" || o.type === "km")) {
      $("a-" + o.id).textContent = o.type === "km" ? "Gratuit jusqu’à 30 km" : `${eur0.format(o.prix)} l’unité`;
    }
    if (!m.dispo && !row.hidden && o.maxConvives) $("a-" + o.id).textContent = `Jusqu’à ${o.maxConvives} convives`;
    const badge = row.querySelector(".badge"), sub = row.querySelector(".sub");
    if (badge) badge.hidden = o.obligatoireSur ? !m.oblig : m.remplace;
    if (sub && o.inutileAvec) sub.hidden = m.remplace;
    if (sub && o.choix) sub.hidden = !m.actif;
    if (o.optionnelPour) {
      row.querySelector("[data-switch]").hidden = !m.facultatif;
      row.querySelector("[data-spacer]").hidden = m.facultatif;
      if (badge) badge.hidden = m.remplace || m.facultatif;
      if (sub) sub.hidden = m.remplace || (m.facultatif && !m.actif);
      row.querySelector(".desc").textContent = m.facultatif ? "En option pour cette formule. Livré et récupéré sur place" : o.detail;
    }
    if (m.remplace) $("a-" + o.id).textContent = "Inutile à la villa";
  }

  // Ticket
  $("recapMeta").textContent = [s.nom, evt.label, plur(s.invites, "convive"), dateFr(s.date)].filter(Boolean).join(" · ");
  const tbody = $("lines");
  tbody.textContent = "";
  for (const l of c.lignes) {
    const tr = document.createElement("tr");
    const td1 = document.createElement("td");
    td1.textContent = l.label;
    const d = document.createElement("span");
    d.className = "d";
    d.textContent = l.detail;
    td1.appendChild(d);
    const td2 = document.createElement("td");
    td2.textContent = eur.format(l.montant);
    tr.append(td1, td2);
    tbody.appendChild(tr);
  }
  $("total").textContent = eur0.format(c.total);
  $("mobileTotal").textContent = eur0.format(c.total);
  $("parInvite").textContent = eur.format(c.parInvite);
  $("acompte").textContent = eur0.format(c.acompte);
  $("acompteLbl").textContent = `acompte de ${pct(TARIFS.acompte)} à la signature`;

  // Lien e-mail prérempli avec le récapitulatif
  const sujet = `Demande de devis · ${evt.label} · ${plur(s.invites, "convive")}` + (s.date ? ` · ${dateFr(s.date)}` : "");
  const corps = "Bonjour David,\n\nJ’ai fait une estimation sur votre site et j’aimerais recevoir un devis définitif.\n\n"
    + texteRecap() + "\n\nLieu de la réception :\nMes disponibilités pour en parler :\n";
  $("ctaMail").href = `mailto:${CONTACT.email}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(corps)}`;
}

/* ---------- Récapitulatif texte ---------- */
function texteRecap() {
  const { s, c } = dernier;
  const evt = TARIFS.evenements[s.evenement];
  const f = evt.formules[s.formule];
  const out = [];
  out.push("Gang of Bordeaux · Devis indicatif");
  out.push("Estimation non contractuelle. Le montant définitif sera établi dans un devis signé.");
  if (s.nom) out.push("Client : " + s.nom);
  out.push(`${evt.label} · ${plur(s.invites, "convive")}` + (s.date ? " · " + dateFr(s.date) : ""));
  out.push(`Formule : ${f.nom} (${f.surPlace.toLowerCase()})`);
  out.push("Menu indicatif : chaque menu est composé sur mesure avec le chef.");
  out.push("");
  for (const l of c.lignes) out.push(`${l.label} (${l.detail}) : ${eur.format(l.montant)}`);
  out.push("");
  out.push("Total indicatif : " + eur.format(c.total));
  out.push(`Soit ${eur.format(c.parInvite)} par convive. Acompte de ${pct(TARIFS.acompte)} à la signature : ${eur.format(c.acompte)}.`);
  return out.join("\n");
}

$("copy").addEventListener("click", () => {
  const txt = texteRecap();
  const fallback = () => {
    const ta = $("copyFallback");
    ta.value = txt; ta.hidden = false; ta.focus(); ta.select();
    $("status").textContent = "Copie automatique indisponible : le texte est sélectionné ci-dessous, copiez-le avec Ctrl+C.";
  };
  try {
    navigator.clipboard.writeText(txt).then(() => {
      $("status").textContent = "Récapitulatif copié. Collez-le dans un e-mail ou un document.";
      $("copyFallback").hidden = true;
    }, fallback);
  } catch (e) { fallback(); }
});

      "@type": "Question",
      name: d.querySelector("summary").textContent.trim(),
      acceptedAnswer: { "@type": "Answer", text: d.querySelector("p").textContent.trim() }
    }))
  };
  const ld = document.createElement("script");
  ld.type = "application/ld+json";
  ld.textContent = JSON.stringify(faq);
  document.head.appendChild(ld);
$("voirDetail").addEventListener("click", (e) => { e.preventDefault(); $("recap").scrollIntoView({ behavior: "smooth", block: "start" }); });
})();
})();
</script>
